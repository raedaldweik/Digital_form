<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2444" />
  <title>Kuwait Smart Border Declaration</title>
  <meta name="description" content="Declare your travel information before arrival and receive instant border clearance decisions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">

    <!-- ============ WELCOME (full image + invisible hotspots) ============ -->
    <section class="screen screen-welcome is-active" id="screen-welcome">
      <div class="welcome-full">
        <img src="assets/welcome_full.jpeg" alt="Kuwait Smart Border Declaration — Welcome" class="welcome-img" />
        <!-- transparent click-zone over the painted Continue button -->
        <button class="hot hot-continue" data-goto="screen-step1" aria-label="Continue"></button>
        <!-- invisible click-zones over the painted language pill (English | العربية) -->
        <div class="welcome-lang" role="group" aria-label="Language">
          <button class="wlang is-active" data-lang="en" aria-label="English"></button>
          <button class="wlang" data-lang="ar" aria-label="العربية"></button>
        </div>
      </div>
    </section>

    <!-- ============ STEP 1 — TRAVELER INFO (design image + fill-in fields) ============ -->
    <section class="screen screen-img" id="screen-step1">
      <div class="imgwrap">
        <img class="designimg" src="assets/traveler_info.jpeg" alt="Traveler Information" />
        <form id="form-step1" class="imgform" novalidate>
          <!-- back -->
          <button type="button" class="ovl ovl-hot" data-goto="screen-welcome" aria-label="Back" style="left:1.2%;top:5.3%;width:6.5%;height:2.9%"></button>
          <!-- fill-in fields, positioned over the drawn input boxes -->
          <input class="ovl ovl-input" type="text" name="passport" placeholder=" " autocomplete="off" required style="left:14.9%;top:36.5%;width:72%;height:3.6%" />
          <input class="ovl ovl-input" type="text" name="fullname" placeholder=" " autocomplete="off" required style="left:14.9%;top:44.1%;width:78%;height:3.6%" />
          <select class="ovl ovl-input ovl-select" name="nationality" required style="left:14.9%;top:51.7%;width:72%;height:3.6%">
            <option value="">Select nationality</option>
          </select>
          <input class="ovl ovl-input" type="text" name="dob" inputmode="numeric" placeholder=" " autocomplete="off" required style="left:14.9%;top:59.2%;width:72%;height:3.6%" />
          <input type="hidden" name="dialcode" value="+965" />
          <input class="ovl ovl-input" type="tel" name="mobile" placeholder=" " autocomplete="off" required style="left:27%;top:66.7%;width:66%;height:3.6%" />
          <input class="ovl ovl-input" type="email" name="email" placeholder=" " autocomplete="off" required style="left:14.9%;top:74.2%;width:78%;height:3.6%" />
          <!-- continue -->
          <button type="submit" class="ovl ovl-hot" aria-label="Continue" style="left:5.4%;top:87.3%;width:89.2%;height:4.6%"></button>
        </form>
      </div>
    </section>

    <!-- ============ STEP 2 — TRAVEL DECLARATION (design image + fill-in fields) ============ -->
    <section class="screen screen-img" id="screen-step2">
      <div class="imgwrap">
        <img class="designimg" src="assets/decleration.jpeg" alt="Travel Declaration" />
        <form id="form-step2" class="imgform" novalidate>
          <!-- back -->
          <button type="button" class="ovl ovl-hot" data-goto="screen-step1" aria-label="Back" style="left:1.2%;top:5.3%;width:6.5%;height:2.9%"></button>
          <!-- functional country of departure (over the drawn dropdown) -->
          <select id="departure" name="departure" class="ovl ovl-input ovl-select" style="left:25.7%;top:33%;width:62%;height:3.4%"></select>
          <!-- functional cash amount -->
          <input type="number" name="cash" min="0" step="any" placeholder=" " class="ovl ovl-input" style="left:18.2%;top:65.6%;width:65%;height:3.5%" />
          <!-- submit -->
          <button type="submit" class="ovl ovl-hot" aria-label="Submit Declaration" style="left:5.4%;top:87.2%;width:89.2%;height:4.7%"></button>

          <!-- hidden controls feeding the decision engine to match the values shown in the design -->
          <input type="hidden" name="purpose" value="Tourism" />
          <input type="hidden" name="duration" value="8-30" />
          <div id="prev-tags" hidden></div>
          <select id="prev-select" hidden><option value=""></option></select>
          <div id="items" hidden>
            <label><input type="checkbox" name="items" value="None" data-none checked /></label>
          </div>
          <div class="yesno" data-name="restricted" hidden><button type="button" class="yn is-active" data-value="No"></button><button type="button" class="yn" data-value="Yes"></button></div>
          <div class="yesno" data-name="merchandise" hidden><button type="button" class="yn is-active" data-value="No"></button><button type="button" class="yn" data-value="Yes"></button></div>
          <div class="yesno" data-name="largecash" hidden><button type="button" class="yn is-active" data-value="No"></button><button type="button" class="yn" data-value="Yes"></button></div>
        </form>
      </div>
    </section>

    <!-- ============ RESULT ============ -->
    <section class="screen screen-result" id="screen-result">
      <div class="result-hero" id="result-hero">
        <header class="topbar topbar--ghost">
          <button class="iconbtn" data-goto="screen-step2" aria-label="Back">‹</button>
          <div class="topbar-brand">
            <div class="brand-text brand-text--center">
              <span class="brand-ar">منصة التصريح الذكي للمنافذ الحدودية</span>
              <span class="brand-en" data-i18n="brand">KUWAIT SMART BORDER DECLARATION</span>
            </div>
          </div>
          <div class="brand-emblem">🛡️</div>
        </header>
        <div class="result-emblem" id="result-emblem">✅</div>
        <h2 class="result-title" id="result-title">Approved for Automated Clearance</h2>
        <p class="result-sub" id="result-sub">You may use the Fast Track Lane</p>
        <div class="risk-pill" id="risk-pill"><span class="risk-dot"></span> <span id="risk-text">Risk Level: Low</span></div>
      </div>

      <div class="screen-scroll result-body">
        <div class="card">
          <div class="card-head"><span class="card-ic">📋</span><h3 data-i18n="res.summary">Decision Summary</h3></div>
          <ul class="summary" id="summary-list"></ul>
        </div>

        <div class="card qr-card" id="qr-card">
          <p class="qr-label" id="qr-label">Border Clearance Pass</p>
          <canvas id="qr-canvas" width="220" height="220" class="qr"></canvas>
          <p class="qr-foot" id="qr-foot">Scan at the border</p>
        </div>

        <div class="card" id="detail-card">
          <div class="card-head"><span class="card-ic">🏛️</span><h3 id="detail-title">Lane Assignment</h3></div>
          <div id="detail-body"></div>
        </div>

        <div class="notice" id="result-notice"></div>

        <button class="btn btn-block" id="result-primary"></button>
        <button class="btn btn-ghost btn-block" data-goto="screen-welcome">
          <span data-i18n="res.new">＋ New Declaration</span>
        </button>
      </div>
    </section>

    <!-- ============ BOTTOM NAV ============ -->
    <nav class="bottomnav" id="bottomnav">
      <button class="nav-item is-active" data-goto="screen-welcome"><span>🏠</span><small data-i18n="nav.home">Home</small></button>
      <button class="nav-item" data-goto="screen-step1"><span>🧾</span><small data-i18n="nav.decl">My Declarations</small></button>
      <button class="nav-item nav-scan"><span>▦</span></button>
      <button class="nav-item"><span class="nav-bell">🔔</span><small data-i18n="nav.notif">Notifications</small></button>
      <button class="nav-item"><span>👤</span><small data-i18n="nav.profile">Profile</small></button>
    </nav>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
